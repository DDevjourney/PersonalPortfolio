<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231A1A1A'/%3E%3Ctext x='50' y='50' font-family='Arial,sans-serif' font-weight='700' font-size='80' fill='white' text-anchor='middle' dominant-baseline='central'%3E%2F%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Este texto es el mismo que og:description y twitter:description.
         Si se cambia, cambiar los tres a la vez. -->
    <meta
      name="description"
      content="Desarrollador web con base en PHP, Laravel, JavaScript y React. Diseño y construyo sitios rápidos y a medida."
    />
    <!-- Color de la barra del navegador en móvil: el mismo papel del fondo -->
    <meta name="theme-color" content="#E8E6E1" />
    <!-- El sitio responde en carlosdsp.es y www.carlosdsp.es. El canonical
         declara cuál de las dos indexar para que no cuenten como duplicado. -->
    <link rel="canonical" href="https://www.carlosdsp.es/" />

    <!-- Open Graph: cómo se ve el enlace al compartirlo en LinkedIn, WhatsApp… -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carlos — Desarrollador Web" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:url" content="https://www.carlosdsp.es/" />
    <meta property="og:title" content="Carlos — Desarrollador Web" />
    <meta
      property="og:description"
      content="Desarrollador web con base en PHP, Laravel, JavaScript y React. Diseño y construyo sitios rápidos y a medida."
    />
    <!-- URL absoluta: los rastreadores no resuelven rutas relativas. -->
    <meta property="og:image" content="https://www.carlosdsp.es/perfil.jpg" />
    <meta property="og:image:width" content="432" />
    <meta property="og:image:height" content="432" />
    <meta property="og:image:alt" content="Carlos, desarrollador web" />

    <!-- Twitter/X. "summary" y no "summary_large_image" porque la imagen es
         cuadrada (432×432); la variante grande espera 1200×630 y recortaría. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Carlos — Desarrollador Web" />
    <meta
      name="twitter:description"
      content="Desarrollador web con base en PHP, Laravel, JavaScript y React. Diseño y construyo sitios rápidos y a medida."
    />
    <meta name="twitter:image" content="https://www.carlosdsp.es/perfil.jpg" />

    <!-- Google Fonts: Anton para titulares, Inter para el cuerpo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Carlos — Desarrollador Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
